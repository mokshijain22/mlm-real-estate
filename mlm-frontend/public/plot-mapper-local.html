function calcFinalPrice(base, cornerPct, gardenPct, roadPct) {
  const b = parseFloat(base);
  if (!b || isNaN(b)) return null;
  const pct = (v) => {
    if (!v) return 0;
    const n = parseFloat(String(v).replace("%", ""));
    return isNaN(n) ? 0 : n;
  };
  const total = b + b * (pct(cornerPct) / 100) + b * (pct(gardenPct) / 100) + b * (pct(roadPct) / 100);
  return Math.round(total);
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (lines.length < 2) return { headers: [], rows: [] };
  const headers = lines[0].split(",").map((h) => h.trim());
  const rows = lines.slice(1).map((line) => {
    const cells = line.split(",");
    const obj = {};
    headers.forEach((h, i) => (obj[h] = (cells[i] || "").trim()));
    return obj;
  });
  return { headers, rows };
}

// Finds pairs of plots whose edges touch — a's bottom sits on b's top (horizontal
// boundary, i.e. plots stacked vertically). Used by the "Adjust lines" tool.
function getHorizontalBoundaries(plots) {
  const boundaries = [];
  plots.forEach((a) => {
    plots.forEach((b) => {
      if (a.id === b.id) return;
      const aBottom = a.y + a.h;
      const overlapW = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      if (overlapW > 4 && Math.abs(aBottom - b.y) < 6) {
        boundaries.push({
          aId: a.id,
          bId: b.id,
          y: aBottom,
          x1: Math.max(a.x, b.x),
          x2: Math.min(a.x + a.w, b.x + b.w),
        });
      }
    });
  });
  return boundaries;
}

function PlotMapper() {
  const imageSrc = IMG_DATA;
  const [mode, setMode] = useState("rect"); // 'rect' | 'row' | 'view'
  const [plots, setPlots] = useState([]);
  const [draft, setDraft] = useState(null); // points being placed
  const [pendingShape, setPendingShape] = useState(null); // shape awaiting form
  const [rowDraft, setRowDraft] = useState(null);
  const [publishStatus, setPublishStatus] = useState(null); // "sent" | null

  const publishToProject = useCallback(() => {
    if (!window.parent || window.parent === window) return;
    const payload = plots.reduce((acc, p) => {
      const lng1 = (p.x / IMG_W) * 1000;
      const lng2 = ((p.x + p.w) / IMG_W) * 1000;
      const lat1 = 1000 - (p.y / IMG_H) * 1000;
      const lat2 = 1000 - ((p.y + p.h) / IMG_H) * 1000;
      acc[p.number] = {
        status: p.status,
        latlngs: [
          [lat1, lng1],
          [lat1, lng2],
          [lat2, lng2],
          [lat2, lng1],
        ],
      };
      return acc;
    }, {});
    window.parent.postMessage({ type: "PLOT_MAPPER_PUBLISH", plots: payload }, "*");
    setPublishStatus("sent");
    setTimeout(() => setPublishStatus(null), 2500);
  }, [plots]);  const [rowCount, setRowCount] = useState(6);
  const [rowStartNum, setRowStartNum] = useState(1);
  const [rowReverse, setRowReverse] = useState(false);
  const [selectedPlot, setSelectedPlot] = useState(null);
  const [draggingBoundary, setDraggingBoundary] = useState(null); // { aId, bId, y }
  const [hoverPlot, setHoverPlot] = useState(null);
  const [csvSummary, setCsvSummary] = useState(null);
  const [csvData, setCsvData] = useState(null); // { [plot_number]: row } — kept even for untraced plots
  const svgRef = useRef(null);
  const csvInputRef = useRef(null);

  const toImgCoords = useCallback((e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * IMG_W;
    const y = ((e.clientY - rect.top) / rect.height) * IMG_H;
    return [Math.round(x), Math.round(y)];
  }, []);

  const handleCanvasClick = (e) => {
    if (mode === "view") return;
    const pt = toImgCoords(e);

    if (mode === "rect") {
      if (!draft) {
        setDraft([pt]);
      } else {
        const [x1, y1] = draft[0];
        const [x2, y2] = pt;
        const shape = {
          x: Math.min(x1, x2),
          y: Math.min(y1, y2),
          w: Math.abs(x2 - x1),
          h: Math.abs(y2 - y1),
        };
        setDraft(null);
        if (shape.w > 4 && shape.h > 4) {
          setPendingShape({ type: "single", rects: [shape] });
        }
      }
    } else if (mode === "row") {
      if (!rowDraft) {
        setRowDraft([pt]);
      } else {
        const [x1, y1] = rowDraft[0];
        const [x2, y2] = pt;
        setRowDraft([rowDraft[0], pt]);
      }
    }
  };

  const confirmRow = () => {
    if (!rowDraft || rowDraft.length < 2) return;
    const [x1, y1] = rowDraft[0];
    const [x2, y2] = rowDraft[1];
    const left = Math.min(x1, x2);
    const top = Math.min(y1, y2);
    const w = Math.abs(x2 - x1);
    const h = Math.abs(y2 - y1);
    const horizontal = w >= h;
    const n = Math.max(1, parseInt(rowCount) || 1);
    const rects = [];
    for (let i = 0; i < n; i++) {
      const idx = rowReverse ? (n - 1 - i) : i;
      if (horizontal) {
        rects.push({ x: left + (w / n) * idx, y: top, w: w / n, h });
      } else {
        rects.push({ x: left, y: top + (h / n) * idx, w, h: h / n });
      }
    }
    setPendingShape({ type: "row", rects, startNum: parseInt(rowStartNum) || 1 });
    setRowDraft(null);
  };

  const cancelDraft = () => {
    setDraft(null);
    setRowDraft(null);
    setPendingShape(null);
  };

  const savePendingSingle = (formData) => {
    const rect = pendingShape.rects[0];
    const csvRow = csvData && csvData[formData.number];
    setPlots((p) => [
      ...p,
      {
        id: formData.number,
        ...rect,
        size: formData.size,
        price: formData.price,
        base_price: formData.base_price,
        status: formData.status,
        facing: formData.facing,
        zone_type: formData.zone_type,
        corner_plot: formData.corner_plot,
        garden_facing: formData.garden_facing,
        road_facing: formData.road_facing,
        corner_premium_percent: formData.corner_premium_percent,
        garden_premium_percent: formData.garden_premium_percent,
        road_width_premium_percent: formData.road_width_premium_percent,
        boundary_n: formData.boundary_n,
        boundary_s: formData.boundary_s,
        boundary_e: formData.boundary_e,
        boundary_w: formData.boundary_w,
        ...(csvRow || {}),
      },
    ]);
    setPendingShape(null);
  };

  const savePendingRow = (formData) => {
    const start = pendingShape.startNum;
    const newPlots = pendingShape.rects.map((rect, i) => {
      const id = String(start + i);
      const csvRow = csvData && csvData[id];
      return {
        id,
        ...rect,
        size: formData.size,
        price: formData.price,
        base_price: formData.base_price,
        status: formData.status,
        facing: formData.facing,
        zone_type: formData.zone_type,
        corner_plot: formData.corner_plot,
        garden_facing: formData.garden_facing,
        road_facing: formData.road_facing,
        corner_premium_percent: formData.corner_premium_percent,
        garden_premium_percent: formData.garden_premium_percent,
        road_width_premium_percent: formData.road_width_premium_percent,
        boundary_n: formData.boundary_n,
        boundary_s: formData.boundary_s,
        boundary_e: formData.boundary_e,
        boundary_w: formData.boundary_w,
        ...(csvRow || {}),
      };
    });
    setPlots((p) => [...p, ...newPlots]);
    setPendingShape(null);
  };

  const deletePlot = (id) => {
    setPlots((p) => p.filter((pl) => pl.id !== id));
    setSelectedPlot(null);
  };

  const startBoundaryDrag = (b) => (e) => {
    e.stopPropagation();
    setDraggingBoundary({ aId: b.aId, bId: b.bId, y: b.y });
  };

  const handleBoundaryDragMove = (e) => {
    if (!draggingBoundary) return;
    const [, y] = toImgCoords(e);
    setDraggingBoundary((d) => (d ? { ...d, y } : d));
  };

  const commitBoundaryDrag = () => {
    if (!draggingBoundary) return;
    const { aId, bId, y } = draggingBoundary;
    setPlots((prev) =>
      prev.map((p) => {
        if (p.id === aId) {
          return { ...p, h: y - p.y };
        }
        if (p.id === bId) {
          const bottom = p.y + p.h;
          return { ...p, y, h: bottom - y };
        }
        return p;
      })
    );
    setDraggingBoundary(null);
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const { rows } = parseCsv(evt.target.result);
      let updatedCount = 0;
      const skipped = [];
      const existingIds = new Set(plots.map((p) => p.id));

      const byId = {};
      rows.forEach((r) => {
        if (r.plot_number) byId[r.plot_number] = r;
      });

      // DEBUG — hata dena baad mein
      console.log("CSV rows parsed:", rows.length);
      console.log("Traced plot IDs on map (existingIds):", [...existingIds]);
      console.log("CSV plot_number keys (byId):", Object.keys(byId));
      console.log("Plot 95 in byId?", byId["95"]);
      console.log("Is 95 in existingIds?", existingIds.has("95"));

     
      setPlots((prev) =>
        prev.map((plot) => {
          const row = byId[plot.id];
          if (!row) return plot;
          updatedCount++;
          const merged = { ...plot };
          [
            "size",
            "base_price",
            "status",
            "facing",
            "zone_type",
            "road_facing",
            "garden_facing",
            "park_facing",
            "corner_plot",
            "corner_premium_percent",
            "garden_premium_percent",
            "road_width_premium_percent",
            "boundary_n",
            "boundary_s",
            "boundary_e",
            "boundary_w",
            "customer_name",
            "customer_contact",
            "booking_date",
            "advance_amount",
          ].forEach((field) => {
            if (row[field] !== undefined && row[field] !== "") merged[field] = row[field];
          });
          if (row.base_price) {
            merged.price = row.base_price;
            merged.finalPrice = calcFinalPrice(
              merged.base_price || row.base_price,
              merged.corner_premium_percent,
              merged.garden_premium_percent,
              merged.road_width_premium_percent
            );
          }
          return merged;
        })
      );

      rows.forEach((r) => {
        if (r.plot_number && !existingIds.has(r.plot_number)) skipped.push(r.plot_number);
      });

      setCsvSummary({ updated: updatedCount, skipped, total: rows.length });
      setCsvData(byId);
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const stats = {
    total: plots.length,
    available: plots.filter((p) => p.status === "available").length,
    hold: plots.filter((p) => p.status === "hold").length,
    sold: plots.filter((p) => p.status === "sold").length,
  };

  return (
    <div style={styles.app}>
      <div style={styles.topbar}>
        <div style={styles.brand}>
          <div style={styles.brandMark}>PM</div>
          <div>
            <div style={styles.brandTitle}>Plot Mapper — trace tool</div>
            <div style={styles.brandSub}>Shri Ramchandra Vatika, Indore–Khandwa Rd</div>
          </div>
        </div>
        <div style={styles.stats}>
          <Stat label="Traced" value={stats.total} color="#e7e2d6" />
          <Stat label="Available" value={stats.available} color={STATUS_COLORS.available} />
          <Stat label="Hold" value={stats.hold} color={STATUS_COLORS.hold} />
          <Stat label="Sold" value={stats.sold} color={STATUS_COLORS.sold} />
        </div>
      </div>

      <div style={styles.body}>
        <div style={styles.toolbar}>
          <ToolBtn
            active={mode === "rect"}
            icon={<PenLine size={16} />}
            label="Trace plot"
            hint="Click 2 opposite corners"
            onClick={() => {
              cancelDraft();
              setMode("rect");
            }}
          />
          <ToolBtn
            active={mode === "row"}
            icon={<Rows3 size={16} />}
            label="Trace row"
            hint="Click 2 outer corners, auto-slice"
            onClick={() => {
              cancelDraft();
              setMode("row");
            }}
          />
          <ToolBtn
            active={mode === "view"}
            icon={<Eye size={16} />}
            label="Preview"
            hint="See public map view"
            onClick={() => {
              cancelDraft();
              setMode("view");
            }}
          />
          <ToolBtn
            active={mode === "adjust"}
            icon={<Rows3 size={16} />}
            label="Adjust lines"
            hint="Drag a shared edge to fix drift"
            onClick={() => {
              cancelDraft();
              setMode("adjust");
            }}
          />

          {mode === "row" && (
            <div style={styles.rowPanel}>
              <div style={styles.rowPanelTitle}>Row settings</div>
              <label style={styles.miniLabel}>Number of plots in row</label>
              <input
                type="number"
                value={rowCount}
                onChange={(e) => setRowCount(e.target.value)}
                style={styles.miniInput}
                min={1}
              />
              <label style={styles.miniLabel}>Starting plot number</label>
              <input
                type="text"
                value={rowStartNum}
                onChange={(e) => setRowStartNum(e.target.value)}
                style={styles.miniInput}
              />
              <label style={{ ...styles.miniLabel, display: "flex", alignItems: "center", gap: 6, marginTop: 6 }}>
                <input
                  type="checkbox"
                  checked={rowReverse}
                  onChange={(e) => setRowReverse(e.target.checked)}
                />
                Reverse numbering direction
              </label>
              {rowDraft && rowDraft.length === 2 && (
                <button style={styles.confirmBtn} onClick={confirmRow}>
                  <Check size={14} /> Slice into {rowCount} plots
                </button>
              )}
              {(draft || rowDraft) && (
                <button style={styles.cancelBtn} onClick={cancelDraft}>
                  <Undo2 size={14} /> Cancel
                </button>
              )}
            </div>
          )}

          {mode === "rect" && draft && (
            <div style={styles.rowPanel}>
              <div style={styles.hintText}>Click the opposite corner to finish the rectangle.</div>
              <button style={styles.cancelBtn} onClick={cancelDraft}>
                <Undo2 size={14} /> Cancel
              </button>
            </div>
          )}

          <div style={styles.divider} />

          <input
            type="file"
            accept=".csv"
            ref={csvInputRef}
            style={{ display: "none" }}
            onChange={handleCsvFile}
          />
          <button style={styles.csvBtn} onClick={() => csvInputRef.current.click()}>
            ⬆ Upload CSV — bulk update
          </button>
          <button
            style={{ ...styles.csvBtn, background: "#2f6f4f" }}
            onClick={publishToProject}
            disabled={plots.length === 0}
          >
            {publishStatus === "sent" ? "✓ Sent to live map" : "🚀 Publish to live map"}
          </button>
          <div style={styles.hintText}>
            Matches by plot number. Fills only the columns you filled in the CSV — leaves the rest as-is.
          </div>

          {csvSummary && (
            <div style={styles.csvSummary}>
              <div style={styles.csvSummaryLine}>
                ✓ {csvSummary.updated} plot{csvSummary.updated === 1 ? "" : "s"} updated
              </div>
              {csvSummary.skipped.length > 0 && (
                <div style={styles.csvSummaryWarn}>
                  ⚠ {csvSummary.skipped.length} not traced yet, skipped: {csvSummary.skipped.slice(0, 8).join(", ")}
                  {csvSummary.skipped.length > 8 ? "…" : ""}
                </div>
              )}
              <button style={styles.csvDismiss} onClick={() => setCsvSummary(null)}>
                Dismiss
              </button>
            </div>
          )}

          <div style={styles.divider} />
          <div style={styles.plotListHeader}>Traced plots ({plots.length})</div>
          <div style={styles.plotList}>
            {plots.length === 0 && (
              <div style={styles.emptyList}>Nothing traced yet — pick a tool and click on the map.</div>
            )}
            {plots.map((p) => (
              <div
                key={p.id}
                style={{
                  ...styles.plotRow,
                  outline: selectedPlot === p.id ? "1px solid #c9a24b" : "1px solid transparent",
                }}
                onMouseEnter={() => setHoverPlot(p.id)}
                onMouseLeave={() => setHoverPlot(null)}
                onClick={() => setSelectedPlot(p.id)}
              >
                <span style={{ ...styles.dot, background: STATUS_COLORS[p.status] }} />
                <span style={styles.plotRowText}>
                  Plot {p.id} · {p.size || "—"}
                </span>
                <button
                  style={styles.deleteBtn}
                  onClick={(e) => {
                    e.stopPropagation();
                    deletePlot(p.id);
                  }}
                >
                  <Trash2 size={13} />
                </button>
              </div>
            ))}
          </div>
        </div>

        <div style={styles.canvasWrap}>
          <div style={styles.canvasInner}>
            <svg
              ref={svgRef}
              viewBox={`0 0 ${IMG_W} ${IMG_H}`}
              style={{
                ...styles.svg,
                cursor: mode === "view" ? "default" : mode === "adjust" ? "row-resize" : "crosshair",
              }}
              onClick={handleCanvasClick}
              onMouseMove={handleBoundaryDragMove}
              onMouseUp={commitBoundaryDrag}
              onMouseLeave={commitBoundaryDrag}
            >
              <image href={imageSrc} x="0" y="0" width={IMG_W} height={IMG_H} />

              {plots.map((p) => (
                <g key={p.id}>
                  <rect
                    x={p.x}
                    y={p.y}
                    width={p.w}
                    height={p.h}
                    fill={STATUS_COLORS[p.status]}
                    fillOpacity={hoverPlot === p.id || selectedPlot === p.id ? 0.62 : 0.4}
                    stroke={STATUS_COLORS[p.status]}
                    strokeWidth={selectedPlot === p.id ? 2.5 : 1.2}
                    style={{ cursor: mode === "view" ? "pointer" : "inherit" }}
                    onClick={(e) => {
                      if (mode === "view") {
                        e.stopPropagation();
                        setSelectedPlot(p.id);
                      }
                    }}
                    onMouseEnter={() => setHoverPlot(p.id)}
                    onMouseLeave={() => setHoverPlot(null)}
                  />
                </g>
              ))}

              {mode === "adjust" &&
                getHorizontalBoundaries(plots).map((b, i) => {
                  const isDragging =
                    draggingBoundary && draggingBoundary.aId === b.aId && draggingBoundary.bId === b.bId;
                  const y = isDragging ? draggingBoundary.y : b.y;
                  return (
                    <g key={`${b.aId}-${b.bId}-${i}`}>
                      <line
                        x1={b.x1}
                        x2={b.x2}
                        y1={y}
                        y2={y}
                        stroke="#c9a24b"
                        strokeWidth={isDragging ? 3 : 2}
                      />
                      <line
                        x1={b.x1}
                        x2={b.x2}
                        y1={b.y}
                        y2={b.y}
                        stroke="transparent"
                        strokeWidth={16}
                        style={{ cursor: "row-resize" }}
                        onMouseDown={startBoundaryDrag(b)}
                      />
                    </g>
                  );
                })}

              {draft && (
                <circle cx={draft[0][0]} cy={draft[0][1]} r={5} fill="#c9a24b" stroke="#1c1a16" strokeWidth={1} />
              )}

              {rowDraft && rowDraft.length === 1 && (
                <circle cx={rowDraft[0][0]} cy={rowDraft[0][1]} r={5} fill="#c9a24b" stroke="#1c1a16" strokeWidth={1} />
              )}
              {rowDraft && rowDraft.length === 2 && (
                <rect
                  x={Math.min(rowDraft[0][0], rowDraft[1][0])}
                  y={Math.min(rowDraft[0][1], rowDraft[1][1])}
                  width={Math.abs(rowDraft[1][0] - rowDraft[0][0])}
                  height={Math.abs(rowDraft[1][1] - rowDraft[0][1])}
                  fill="#c9a24b"
                  fillOpacity={0.25}
                  stroke="#c9a24b"
                  strokeDasharray="4 3"
                  strokeWidth={1.5}
                />
              )}
            </svg>
          </div>
        </div>

        {mode === "view" && selectedPlot && (
          <PlotDetailModal
            plot={plots.find((p) => p.id === selectedPlot)}
            onClose={() => setSelectedPlot(null)}
          />
        )}
      </div>

      {pendingShape && pendingShape.type === "single" && (
        <PlotForm
          title={`New plot`}
          fields="full"
          onCancel={() => setPendingShape(null)}
          onSave={savePendingSingle}
          csvData={csvData}
        />
      )}
      {pendingShape && pendingShape.type === "row" && (
        <PlotForm
          title={`${pendingShape.rects.length} plots — set shared size, price & facing`}
          fields="row"
          onCancel={() => setPendingShape(null)}
          csvData={csvData}
          defaultNumber={pendingShape.startNum}
          onSave={savePendingRow}
        />
      )}
    </div>
  );
}

function PlotForm({ title, fields, onCancel, onSave, csvData, defaultNumber }) {
  const startVal = fields === "row" ? String(defaultNumber || "") : "";
  const startRow = csvData && startVal ? csvData[startVal] : null;

  const [number, setNumber] = useState("");
  const [size, setSize] = useState(startRow?.size || "");
  const [price, setPrice] = useState(startRow?.base_price || "");
  const [status, setStatus] = useState(startRow?.status || "available");
  const [facing, setFacing] = useState(startRow?.facing || "North");
  const [zoneType, setZoneType] = useState(startRow?.zone_type || "standard");
  const [cornerPlot, setCornerPlot] = useState(startRow?.corner_plot === "yes");
  const [gardenFacing, setGardenFacing] = useState(startRow?.garden_facing === "yes");
  const [roadFacing, setRoadFacing] = useState(startRow?.road_facing === "yes");
  const [cornerPct, setCornerPct] = useState(startRow?.corner_premium_percent || "");
  const [gardenPct, setGardenPct] = useState(startRow?.garden_premium_percent || "");
  const [roadPct, setRoadPct] = useState(startRow?.road_width_premium_percent || "");
  const [boundaryN, setBoundaryN] = useState(startRow?.boundary_n || "");
  const [boundaryS, setBoundaryS] = useState(startRow?.boundary_s || "");
  const [boundaryE, setBoundaryE] = useState(startRow?.boundary_e || "");
  const [boundaryW, setBoundaryW] = useState(startRow?.boundary_w || "");
  const [autoFilled, setAutoFilled] = useState(!!startRow);

  const applyCsvRow = (row) => {
    if (!row) return;
    if (row.size) setSize(row.size);
    if (row.base_price) setPrice(row.base_price);
    if (row.status) setStatus(row.status);
    if (row.facing) setFacing(row.facing);
    if (row.zone_type) setZoneType(row.zone_type);
    setCornerPlot(row.corner_plot === "yes");
    setGardenFacing(row.garden_facing === "yes");
    setRoadFacing(row.road_facing === "yes");
    if (row.corner_premium_percent) setCornerPct(row.corner_premium_percent);
    if (row.garden_premium_percent) setGardenPct(row.garden_premium_percent);
    if (row.road_width_premium_percent) setRoadPct(row.road_width_premium_percent);
    if (row.boundary_n) setBoundaryN(row.boundary_n);
    if (row.boundary_s) setBoundaryS(row.boundary_s);
    if (row.boundary_e) setBoundaryE(row.boundary_e);
    if (row.boundary_w) setBoundaryW(row.boundary_w);
    setAutoFilled(true);
  };

  const handleNumberChange = (val) => {
    setNumber(val);
    if (csvData && csvData[val]) applyCsvRow(csvData[val]);
    else setAutoFilled(false);
  };

  const canSave = fields === "row" ? size.trim().length > 0 : number.trim().length > 0;

  const collectExtra = () => ({
    zone_type: zoneType,
    corner_plot: cornerPlot ? "yes" : "no",
    garden_facing: gardenFacing ? "yes" : "no",
    road_facing: roadFacing ? "yes" : "no",
    corner_premium_percent: cornerPct,
    garden_premium_percent: gardenPct,
    road_width_premium_percent: roadPct,
    boundary_n: boundaryN,
    boundary_s: boundaryS,
    boundary_e: boundaryE,
    boundary_w: boundaryW,
    base_price: price,
  });

  return (
    <div style={styles.modalOverlay}>
      <div style={{ ...styles.modal, width: 360 }}>
        <div style={styles.modalHeader}>
          <span>{title}</span>
          <button style={styles.iconBtn} onClick={onCancel}>
            <X size={16} />
          </button>
        </div>
        <div style={{ ...styles.modalBody, maxHeight: "62vh", overflowY: "auto" }}>
          {autoFilled && (
            <div style={styles.autoFillBanner}>✓ Auto-filled from your uploaded CSV — check before saving</div>
          )}

          {fields === "full" && (
            <Field label="Plot number">
              <input
                autoFocus
                style={styles.input}
                value={number}
                onChange={(e) => handleNumberChange(e.target.value)}
                placeholder="e.g. 47"
              />
            </Field>
          )}

          {fields === "full" && (
            <Field label="Status">
              <div style={styles.statusPicker}>
                {Object.keys(STATUS_COLORS).map((s) => (
                  <button
                    key={s}
                    onClick={() => setStatus(s)}
                    style={{
                      ...styles.statusChip,
                      background: status === s ? STATUS_COLORS[s] : "transparent",
                      borderColor: STATUS_COLORS[s],
                      color: status === s ? "#1c1a16" : STATUS_COLORS[s],
                    }}
                  >
                    {STATUS_LABEL[s]}
                  </button>
                ))}
              </div>
            </Field>
          )}

          <Field label="Plot size">
            <input
              style={styles.input}
              value={size}
              onChange={(e) => setSize(e.target.value)}
              placeholder="e.g. 20' x 45'"
            />
          </Field>
          <Field label="Base price (₹)">
            <input
              style={styles.input}
              value={price}
              onChange={(e) => setPrice(e.target.value)}
              placeholder="e.g. 900000"
            />
          </Field>
          <Field label="Facing">
            <select style={styles.input} value={facing} onChange={(e) => setFacing(e.target.value)}>
              <option>North</option>
              <option>South</option>
              <option>East</option>
              <option>West</option>
            </select>
          </Field>
          <Field label="Zone type">
            <select style={styles.input} value={zoneType} onChange={(e) => setZoneType(e.target.value)}>
              <option value="standard">Standard</option>
              <option value="corner">Corner</option>
              <option value="premium">Premium</option>
            </select>
          </Field>

          <div style={styles.detailSectionLabel}>Plot features & premiums</div>
          <div style={styles.checkRow}>
            <label style={styles.checkLabel}>
              <input type="checkbox" checked={cornerPlot} onChange={(e) => setCornerPlot(e.target.checked)} />
              Corner plot
            </label>
            <input
              style={styles.pctInput}
              value={cornerPct}
              onChange={(e) => setCornerPct(e.target.value)}
              placeholder="+5%"
              disabled={!cornerPlot}
            />
          </div>
          <div style={styles.checkRow}>
            <label style={styles.checkLabel}>
              <input type="checkbox" checked={gardenFacing} onChange={(e) => setGardenFacing(e.target.checked)} />
              Garden facing
            </label>
            <input
              style={styles.pctInput}
              value={gardenPct}
              onChange={(e) => setGardenPct(e.target.value)}
              placeholder="+3%"
              disabled={!gardenFacing}
            />
          </div>
          <div style={styles.checkRow}>
            <label style={styles.checkLabel}>
              <input type="checkbox" checked={roadFacing} onChange={(e) => setRoadFacing(e.target.checked)} />
              Road facing
            </label>
            <input
              style={styles.pctInput}
              value={roadPct}
              onChange={(e) => setRoadPct(e.target.value)}
              placeholder="+4%"
              disabled={!roadFacing}
            />
          </div>

          <div style={styles.detailSectionLabel}>Boundaries</div>
          <div style={styles.boundaryInputGrid}>
            <input style={styles.input} value={boundaryN} onChange={(e) => setBoundaryN(e.target.value)} placeholder="N — e.g. Road" />
            <input style={styles.input} value={boundaryS} onChange={(e) => setBoundaryS(e.target.value)} placeholder="S — e.g. Plot 47" />
            <input style={styles.input} value={boundaryE} onChange={(e) => setBoundaryE(e.target.value)} placeholder="E — e.g. Garden" />
            <input style={styles.input} value={boundaryW} onChange={(e) => setBoundaryW(e.target.value)} placeholder="W — e.g. Road" />
          </div>
        </div>
        <div style={styles.modalFooter}>
          <button style={styles.cancelBtnFull} onClick={onCancel}>
            Cancel
          </button>
          <button
            style={{ ...styles.saveBtn, opacity: canSave ? 1 : 0.5 }}
            disabled={!canSave}
            onClick={() =>
              canSave &&
              onSave({
                number: number || "—",
                size,
                price,
                status,
                facing,
                ...collectExtra(),
              })
            }
          >
            Save {fields === "row" ? "all plots" : "plot"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={styles.field}>
      <label style={styles.fieldLabel}>{label}</label>
      {children}
    </div>
  );
}

function PlotDetailModal({ plot, onClose }) {
  if (!plot) return null;
  const areaSqft = (() => {
    const m = /(\d+)['"]?\s*[xX]\s*(\d+)/.exec(plot.size || "");
    if (m) return parseInt(m[1]) * parseInt(m[2]);
    return null;
  })();

  const finalPrice =
    plot.finalPrice ||
    calcFinalPrice(
      plot.base_price || plot.price,
      plot.corner_premium_percent,
      plot.garden_premium_percent,
      plot.road_width_premium_percent
    );

  const tags = [];
  if (plot.corner_plot === "yes") tags.push(`Corner${plot.corner_premium_percent ? ` +${plot.corner_premium_percent}` : ""}`);
  if (plot.garden_facing === "yes") tags.push(`Garden facing${plot.garden_premium_percent ? ` +${plot.garden_premium_percent}` : ""}`);
  if (plot.road_facing === "yes") tags.push(`Road facing${plot.road_width_premium_percent ? ` +${plot.road_width_premium_percent}` : ""}`);
  if (plot.park_facing === "yes") tags.push("Park facing");
  if (plot.zone_type) tags.push(plot.zone_type.charAt(0).toUpperCase() + plot.zone_type.slice(1));

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.detailModal} onClick={(e) => e.stopPropagation()}>
        <button style={styles.iconBtn} onClick={onClose}>
          <X size={18} />
        </button>

        <div style={styles.detailModalHeader}>
          <div style={styles.detailModalTitle}>Plot {plot.id}</div>
          <span
            style={{
              ...styles.detailStatusPill,
              background: STATUS_COLORS[plot.status],
            }}
          >
            {STATUS_LABEL[plot.status]}
          </span>
        </div>
        <div style={styles.detailModalSub}>Shri Ramchandra Vatika · Indore–Khandwa Road</div>

        <div style={styles.detailGrid}>
          <DetailStat label="Plot area" value={plot.size ? `${plot.size}` : "—"} />
          <DetailStat label="Total area" value={areaSqft ? `${areaSqft} sq ft` : "—"} />
          <DetailStat label="Facing" value={plot.facing || "—"} />
          <DetailStat
            label={finalPrice && finalPrice != (plot.base_price || plot.price) ? "Final price" : "Price"}
            value={finalPrice ? `₹${Number(finalPrice).toLocaleString("en-IN")}` : "—"}
          />
        </div>

        {tags.length > 0 && (
          <>
            <div style={styles.detailSectionLabel}>Plot type & premiums</div>
            <div style={styles.tagRow}>
              {tags.map((t) => (
                <span key={t} style={styles.tag}>
                  {t}
                </span>
              ))}
            </div>
          </>
        )}

        <div style={styles.detailSectionLabel}>Boundaries</div>
        <div style={styles.boundaryGrid}>
          <BoundaryCell label="N" value={plot.boundary_n || "—"} />
          <BoundaryCell label="S" value={plot.boundary_s || "—"} />
          <BoundaryCell label="E" value={plot.boundary_e || "—"} />
          <BoundaryCell label="W" value={plot.boundary_w || "—"} />
        </div>

        <div style={styles.detailActions}>
          <button style={styles.enquireBtn}>Enquire about this plot</button>
          <button style={styles.secondaryBtn} onClick={onClose}>
            Back to map
          </button>
        </div>
      </div>
    </div>
  );
}

function DetailStat({ label, value }) {
  return (
    <div style={styles.detailStatBox}>
      <div style={styles.detailStatLabel}>{label}</div>
      <div style={styles.detailStatValue}>{value}</div>
    </div>
  );
}

function BoundaryCell({ label, value }) {
  return (
    <div style={styles.boundaryCell}>
      <span style={styles.boundaryDir}>{label}</span>
      <span style={styles.boundaryVal}>{value}</span>
    </div>
  );
}
